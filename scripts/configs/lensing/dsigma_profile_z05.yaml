# Simulated Delta Sigma profiles against the HSC Y3 x DESI LRG bin1 measurement.
#
# The radial bins are NOT set here: they are read from the data file itself
# (see plot.data_path) and each simulation is stacked at exactly those comoving
# separations. The measurement's rp bins are linspace(1, 6) arcmin in 9 steps,
# evaluated at the mean lens redshift z_eff = 0.5099 with Planck18.
#
# Simulation set kept in sync with configs/unbound_gas/tau_z05_CAP_masked_flamingo.yaml
# so that the halo sample selected here can be reused for the kSZ comparison.
stack:
  redshift: 0.5
  load_field: true
  save_field: false

  # The radial grid comes entirely from the data file's rp column, so there are
  # no min_radius / max_radius / num_radii / rad_distance keys here.

  projection: 'yz' # 'xy', 'xz', 'yz'
  pixel_size: 0.2 # in arcmin. 0.2 keeps every 'total' field a cache hit (incl. FLAMINGO)
                  # and cuts the inner-radius bias of the DSigma filter.
  filter_type: 'DSigma' # Options: 'CAP', 'cumulative', 'DSigma'
  particle_type: 'total'

  # Annulus width of the compensated DSigma kernel, in arcmin. Converted to
  # ckpc/h per simulation before it reaches the filter. Without this the filter
  # falls back to 3 pixels, which at pixel_size 0.5 was 1.5 arcmin -- wider than
  # the innermost radius, biasing DeltaSigma high by ~70% at 1 arcmin.
  dsigma_dr: 0.3 # in arcmin

  # Halo selection: SHAM on subhalo stellar mass, matching simulated_kSZ.py so
  # the same sample can be carried over to the kSZ comparison.
  use_subhalos: true
  halo_abundance_target: 5.0e-4 # target number density in (cMpc/h)^-3
  halo_mass_upper: 5.0e+14       # parent FoF mass cap in Msun/h

plot:
  plot_data: True
  data_path: '/pscratch/sd/r/rhliu/projects/Weak_lensing/hsc/products/spec_Y3/dsigma_tomo_noboost_hscy3_bin3_LRG_bin1.fits'
  data_label: 'HSCY3 Bin3 x LRG bin1 Lensing'
  # Hubble parameter of the cosmology the measurement was made with (Planck18,
  # see DESIxHSC-Lensing/scripts/precompute_pipeline_combined.py). Used as the
  # single reference h for the shared ckpc/h axis, so that the simulations --
  # which each have their own h -- and the data land on identical x values.
  data_h: 0.6766
  fig_path: '../figures/'
  fig_name: 'dsigma_profiles_yz'
  fig_type: 'png'
  plot_error_bars: true


simulations:
  - sim_type: 'SIMBA'
    sims:
      - name: 'm50n512'
        snapshot: 125
        feedback: 's50noagn'
      - name: 'm50n512'
        snapshot: 125
        feedback: 's50nox'
      - name: 'm50n512'
        snapshot: 125
        feedback: 's50nofb'
      - name: 'm100n1024'
        snapshot: 125
        feedback: 's50'
  - sim_type: 'IllustrisTNG'
    sims:
      - name: 'TNG100-1'
        snapshot: 67
      - name: 'TNG300-1'
        snapshot: 67
      - name: 'Illustris-1'
        snapshot: 103
  - sim_type: 'FLAMINGO'
    sims:
      # feedback holds the FLAMINGO variant directory name ('L1_m9' = fiducial).
      # Snapshot 67 is z=0.5, matching stack.redshift above.
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'L1_m9'
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'fgas-8sigma'
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'Jet_fgas-4sigma'
