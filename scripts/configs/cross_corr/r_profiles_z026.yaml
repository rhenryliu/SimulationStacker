# Task 1 r-profiles, BGS-like sample at z ~ 0.26 (FLAMINGO at z = 0.30).
#
# Companion to r_profiles_z05.yaml; identical filter and jackknife settings,
# a denser SHAM sample, and the lower-redshift snapshot of each suite.  The
# redshift split (BGS at z = 0.26, FLAMINGO at z = 0.30) follows
# docs/cross_correlation_notes.md Sec. 6.
#
# Note docs/r_profiles_task1_spec.md states that FLAMINGO snapshot 71 is not
# downloaded and that this sweep is therefore out of scope.  That is no longer
# true: snapshot 71 (z = 0.3000) is present for all three variants, with SOAP
# catalogues and cached projected fields, so FLAMINGO is included here.
#
# Run with:
#   cd scripts/
#   python cross_corr/make_r_profiles.py -p configs/cross_corr/r_profiles_z026.yaml

stack:
  redshift: 0.26

  projections: ['yz']

  min_radius: 1.0
  max_radius: 6.0
  num_radii: 9
  # See r_profiles_z05.yaml for the rationale.
  extend_max_radius: 10.0
  dr_arcmin: 0.75        # annulus width of the compensated filter

  # Upsilon reference radius.  Restored to 1' from the exploratory 2' of
  # commit 91e39d7: the R0 scan in docs/r_profiles_implementation_plan.md U6
  # measured 1' as the only PASS at z ~ 0.5 (cross-code scatter 0.090 against
  # 0.143), the most usable bins, and the one R0 whose statistic is neither
  # propped up by nor hostage to the fragile bin next to the cut.
  r0_arcmin: 1.0         # Upsilon reference radius

  # Park et al. (2021) Y transform, Y(R; Rmax) = Sigma(R) - Sigma(Rmax).
  # Compensated (unlike Sigma) and local from below (unlike DSigma), it
  # references the LARGEST aperture rather than the smallest.  Bins at and
  # above 0.8*Rmax are masked, where the transform vanishes by construction.
  # 6' is the top of the data range and is already an aperture-grid point, so
  # the grid is unchanged; the addendum's fiducial 5' would leave only five
  # usable bins in 1'-6' and its best-performing 9' sits outside the range the
  # kSZ stack measures (v0.3 response Sec. 4.2).
  ytransform_rmax: 6.0

  n_jk_side: 4

  load_field: true
  save_field: false

  particle_type_e: 'ionized_gas'
  particle_type_b: 'baryon'

  # Denser than the LRG sample, matching the BGS-like target of the spec.
  halo_abundance_target: 1.0e-3    # (cMpc/h)^-3
  parent_mass_upper: 5.0e14        # Msun/h

plot:
  npz_path: '../data/r_profiles/'
  fig_path: '../figures/'
  fig_name: 'r_profiles_z026'
  fig_type: 'png'

# SIMBA m100n1024 and Illustris-1 were dropped after Task 1: their boxes are
# 100 and 75 cMpc/h, giving only 500 and 210 SHAM galaxies at these number
# densities, which is too few to measure Y_gg over 1'-6'. Their jackknife
# errors on r_bm/r_gb exceeded the cross-code scatter itself, so they added
# noise rather than a cross-code constraint. See docs/r_profiles_implementation_plan.md.
simulations:
  - sim_type: 'IllustrisTNG'
    sims:
      - name: 'TNG300-1'
        snapshot: 80
        n_pixels: 4822
  - sim_type: 'FLAMINGO'
    sims:
      # feedback holds the FLAMINGO variant directory name ('L1_m9' = fiducial)
      - name: 'L1_m9'
        snapshot: 71
        feedback: 'L1_m9'
        n_pixels: 14015
      - name: 'L1_m9'
        snapshot: 71
        feedback: 'fgas-8sigma'
        n_pixels: 14015
      - name: 'L1_m9'
        snapshot: 71
        feedback: 'Jet_fgas-4sigma'
        n_pixels: 14015
