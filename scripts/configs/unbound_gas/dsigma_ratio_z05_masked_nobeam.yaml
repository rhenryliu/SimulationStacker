# Config for simulated_dsigma_ratio_masked.py, beam-compensated version
# (2026-10-12): as dsigma_ratio_z05_masked.yaml, but with the ionized gas
# unconvolved on the denominator's 0.2' pixels, and the beam-compensated
# Liu et al. 2026 measurement (beam_compensated_ratio_v2.py's comparison).
#
# The masked ionized-gas fields are built at particle level around the same
# lensing-fit SHAM hosts by precompute_masked_particles.py
# (runINT_masked_ionized_gas_particles.sh); a 0.2' cube would be 8869^3 for
# FLAMINGO. The unmasked numerator is the cached 0.2' ionized_gas field.
# Run from the scripts/ directory:
#   python unbound_gas/simulated_dsigma_ratio_masked.py -p configs/unbound_gas/dsigma_ratio_z05_masked_nobeam.yaml --workers 12

stack:
  redshift: 0.5
  projection: 'yz'
  # Numerator: unconvolved ionized-gas fields, masked at particle level.
  numerator: 'ionized_gas_field'
  particle_type: 'ionized_gas'
  pixel_size: 0.2            # arcmin
  beam_size: 0               # arcmin FWHM; checked against the masked maps
  # Denominator: unconvolved total-matter field, unmasked in every column.
  particle_type_2: 'total'
  pixel_size_2: 0.2          # arcmin
  # The measurement's radii (9 points, 1' to 6') and the 0.75' DSigma annulus.
  min_radius: 1.0            # arcmin
  max_radius: 6.0            # arcmin
  num_radii: 9
  annulus: 0.75              # arcmin
  # Gas kept within these multiples of each host's R200m (columns 1-3).
  mask_radii: [1.0, 2.0, 3.0]
  # SHAM parent-mass cap (Msun/h), as the beamed figure and the masked maps.
  halo_mass_upper: 5.0e+14
  # SHAM densities fitted on lensing, as the beamed figure.
  abundance_from_fit: ['../data/fit_dsigma_ksz/fit_dsigma_ksz_z05.npz',
                       '../data/fit_dsigma_ksz/fit_dsigma_ksz_z05_simba50.npz',
                       '../data/fit_dsigma_ksz/fit_dsigma_ksz_z05_mstar.npz']
  # Beam factor of these samples (beamed / unbeamed unmasked numerator),
  # reported against the published one, which beam_compensated_ratio_v2.py
  # averaged over these six runs at SHAM n = 5e-4. Reported only: the plotted
  # data keep the published compensation (user decision 2026-10-12).
  # beamed_npz is the profiles file of the beamed figure (figures/ is not
  # tracked): dsigma_ratio_z05_masked.yaml at commit 5d02be1, job 59701623.
  beam_factor:
    beamed_npz: '../figures/2026-10/10-11/dsigma_ratio_yz_masked_z0.5_profiles.npz'
    published_npz: '../data/beam_compensated/beam_compensated_ionized_gas_total_z0.5.npz'
    average_over: ['SIMBA/m100n1024/s50', 'IllustrisTNG/TNG300-1', 'IllustrisTNG/Illustris-1',
                   'FLAMINGO/L1_m9/L1_m9', 'FLAMINGO/L1_m9/fgas-8sigma',
                   'FLAMINGO/L1_m9/Jet_fgas-4sigma']

plot:
  plot_data: true
  # Beam-compensated measurement (beam_compensated_ratio_v2.py, use_sim_scatter false).
  data_path: '../data/beam_compensated/beam_compensated_ionized_gas_total_z0.5.npz'
  data_keys: {theta: 'theta_arcmin', value: 'R_compensated', error: 'sigma_compensated'}
  data_label: 'Liu et al. 2026 (beam-corrected)'
  fig_path: '../figures/'
  fig_name: 'dsigma_ratio_yz_masked_nobeam'
  fig_type: 'pdf'
  plot_error_bars: true
  suptitle: false
  row_height: 3.8
  # Legends in the 1 R200m column, as in the beamed figure.
  legend_column: 0
  legend_loc: 'upper right'
  # Room above the curves for the legends (the SIMBA-50 rows reach ~0.65 at 1').
  ylim: [0.05, 1.2]

simulations:
  - sim_type: 'SIMBA'
    sims:
      - name: 'm50n512'
        snapshot: 125
        feedback: 's50noagn'
      - name: 'm50n512'
        snapshot: 125
        feedback: 's50nox'
      - name: 'm50n512'
        snapshot: 125
        feedback: 's50nofb'
      - name: 'm100n1024'
        snapshot: 125
        feedback: 's50'
  - sim_type: 'IllustrisTNG'
    sims:
      - name: 'TNG100-1'
        snapshot: 67
      - name: 'TNG300-1'
        snapshot: 67
      - name: 'Illustris-1'
        snapshot: 103
  - sim_type: 'FLAMINGO'
    row_label: 'FLAMINGO'
    sims:
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'L1_m9'
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'fgas-8sigma'
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'Jet_fgas-4sigma'
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'Mstar-1sigma'
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'Mstar-1sigma_fgas-4sigma'
