# Same as tau_z05_CAP_masked.yaml, plus the FLAMINGO suite as a third row.
# Kept separate because tau_z05_CAP_masked.yaml is also consumed by
# simulated_SZ_masked.py (via stack_SZ.sh), which only handles two sim types.
stack:
  redshift: 0.5
  filter_type: 'CAP' # Options: 'CAP', 'cumulative', 'DSigma
  # filter_type: 'cumulative' # Options: 'CAP', 'cumulative', 'DSigma
  load_field: true
  save_field: true
  rad_distance: 1.0 # in arcmin
  particle_type: 'tau'
  projection: 'xy' # 'xy', 'xz', 'yz'
  mask_haloes: false
  mask_radii: 3.0 # Number of virial radii to mask out for haloes. In units of R200c
  pixel_size: 0.5 # in arcmin
  use_subhalos: true # Whether to use subhalos for selection (SHAM) instead of halos (mass cut)
  # SHAM density per simulation, fitted to the HSC Y3 x DESI LRG bin-1 lensing
  # profile by lensing/fit_dsigma_ksz.py; the SIMBA-50 variants have their own
  # (noisier) fit. The masked maps are built around the hosts of these samples
  # (unbound_gas/precompute_masked_sham_hosts.py).
  abundance_from_fit: ['../data/fit_dsigma_ksz/fit_dsigma_ksz_z05.npz',
                       '../data/fit_dsigma_ksz/fit_dsigma_ksz_z05_simba50.npz',
                       '../data/fit_dsigma_ksz/fit_dsigma_ksz_z05_mstar.npz']

plot:
  plot_data: true
  # data_path: '../data/Fig1_Fig8_dr10_allfoot_perbin_dr6_pzbin1.npz'
  data_path: '../data/Fig2_sim.npz'
  data_label: 'Hadzhiyska 2024'
  fig_path: '../figures/'
  fig_name: 'profiles_xy_masked_flamingo'
  fig_type: 'pdf'
  plot_error_bars: true
  # Paper layout: no figure title, rows slightly shorter than the 4.5 in default.
  suptitle: false
  row_height: 3.8



simulations:
  - sim_type: 'SIMBA'
    sims:
      # - name: 'm50n512'
      #   snapshot: 125
      #   feedback: 's50'
      - name: 'm50n512'
        snapshot: 125
        feedback: 's50noagn'
      - name: 'm50n512'
        snapshot: 125
        feedback: 's50nox'
      # - name: 'm50n512'
      #   snapshot: 125
      #   feedback: 's50nojet'
      - name: 'm50n512'
        snapshot: 125
        feedback: 's50nofb'
      - name: 'm100n1024'
        snapshot: 125
        feedback: 's50'
  - sim_type: 'IllustrisTNG'
    sims:
      - name: 'TNG100-1'
        snapshot: 67
      - name: 'TNG300-1'
        snapshot: 67
      # - name: 'TNG300-2'
      #   snapshot: 67
      - name: 'Illustris-1'
        snapshot: 103
      # - name: 'Illustris-2'
      #   snapshot: 103
  # One FLAMINGO row (2026-10-07): the AGN variants and the stellar-mass
  # variants (iteration 3) together; until then they had a row each, both
  # with L1_m9 as the reference.
  - sim_type: 'FLAMINGO'
    row_label: 'FLAMINGO'
    sims:
      # feedback holds the FLAMINGO variant directory name ('L1_m9' = fiducial).
      # Snapshot 67 is z=0.5, matching stack.redshift above.
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'L1_m9'
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'fgas-8sigma'
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'Jet_fgas-4sigma'
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'Mstar-1sigma'
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'Mstar-1sigma_fgas-4sigma'
