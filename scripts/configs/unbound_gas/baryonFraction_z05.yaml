# baryonFraction_z05.yaml
# -----------------------
# Configuration for make_baryonFraction.py (unbound gas paper, Figure 5).
#
# Split off from stackArea_z05.yaml, which make_stackArea.py (Figure 4) still
# uses: this figure carries six simulations on a 3x2 grid, and adding them to
# the shared config would have silently turned Figure 4 into a 2x6 strip.
#
# Produces two 3-row x 2-column figures at z=0.5, panels filled column-major:
#   Left column  : TNG300-1 | Illustris-1 | SIMBA m100n1024
#   Right column : FLAMINGO L1_m9 | fgas-8sigma | Jet_fgas-4sigma
#
#   <fig_name>_3D_shell_baryonFraction.pdf  -- 3D differential (spherical shells)
#   <fig_name>_2D_ring_baryonFraction.pdf   -- 2D differential (annuli)
#
# Run from the scripts/ directory:
#   python unbound_gas/make_baryonFraction.py -p configs/unbound_gas/baryonFraction_z05.yaml

stack:
  redshift: 0.5

  # Cache behaviour: load pre-computed fields/maps from disk when available,
  # and save newly computed ones for future runs.
  load_field: true
  save_field: true

  # Stacking radii expressed in comoving kpc/h.
  # For 2D runs these are automatically converted to arcmin via the cosmology.
  min_radius: 0.0      # comoving kpc/h
  max_radius: 4000.0   # comoving kpc/h
  num_radii: 19        # number of radial-grid EDGES -> 18 shells / annuli

  # Overall multiplicative scale for the plotted x-axis values (set to 1 for
  # no scaling).
  rad_distance: 1.0

  # Default 3-D field resolution: voxels per side of the cubic grid. Individual
  # simulations may override it with their own `n_pixels` (see the FLAMINGO
  # entries below), because the boxes differ in size by a factor of ~3.
  #
  # At 1000 voxels: 205 ckpc/h per voxel for TNG300-1, 75 for Illustris-1 and
  # 100 for SIMBA m100n1024 -- all at or below the 222 ckpc/h shell width.
  n_pixels: 1000

  # 2-D map settings.
  # beam_size: 0 disables the Gaussian convolution, which the differential
  # ('ring') mode needs: 4000 ckpc/h spans ~10.4 arcmin at z=0.5, so the 18
  # annuli are ~0.58 arcmin wide -- narrower than a 1.6 arcmin ACT beam. With
  # the beam on, a ring measures the beam rather than the gas.
  # At pixel_size 0.2 the cached 2D fields are already on scratch for all six
  # simulations (nPixels 2674 / 966 / 1301 / 8869).
  pixel_size: 0.2   # arcmin per pixel in 2-D projected maps
  beam_size: 0      # arcmin FWHM; 0 disables smoothing

  # 3-D mode: false -> mass in the spherical shell between consecutive radial
  # edges (differential, stacked bar); true -> mass within a sphere (cumulative,
  # stacked area).
  sphere: false

  # Projection axis used both when building 3-D fields and when making 2-D maps.
  # 'yz' is the only projection cached at pixel_size 0.2.
  projection: 'yz'  # options: 'xy', 'xz', 'yz'

  # 2-D mode, the analogue of `sphere` above:
  #   'ring'       -> mass in the annulus between consecutive edges (stacked bar)
  #   'cumulative' -> mass within a disk of radius R          (stacked area)
  #   'CAP'        -> compensated aperture filter             (stacked area)
  filter_type: 'ring'

  # Obtain neutral_gas as (gas - ionized_gas) rather than stacking the
  # neutral_gas field. The two agree to float32 round-off because both bin the
  # same particles with linear masses, and no neutral_gas field is cached at
  # 0.2 arcmin (nor in 3D for FLAMINGO). Flip to false once those fields exist.
  derive_neutral_gas: true

  # Baryon components to decompose.  The stacked fraction of each is plotted
  # separately, normalised by the sum of all baryon-type fields (so the
  # components always sum to 1; no Omega_b / Omega_m normalisation is applied).
  baryon_types: ['ionized_gas', 'neutral_gas', 'Stars', 'BH']

  # Halo selection ('massive' method): pick the highest-mass haloes whose
  # cumulative average mass matches halo_mass_avg, capped at halo_mass_upper.
  # Applied identically to the 3-D and 2-D stacks so both use the same sample.
  # NB: exponents must be signed (e.g. 5.0e+14, not 5.0e14) or PyYAML parses
  # them as strings rather than floats.
  halo_mass_avg: 1.6595869e+13   # target average halo mass [M_sun/h] (= 10**13.22)
  halo_mass_upper: 5.0e+14       # upper halo-mass bound [M_sun/h]

  # NB: not read by make_baryonFraction.py. Carried over from stackArea_z05.yaml
  # and kept only so the two configs stay comparable; flipping it has no effect
  # here. Wiring it up would mean passing it to stackMap for the 2-D path, and
  # writing new code for the 3-D cutout-sum path, which has no equivalent hook.
  subtract_mean: false


plot:
  fig_path: '../figures/'
  fig_name: 'combined'
  fig_type: 'pdf'
  n_cols: 2          # panels are filled column-major; rows follow from the count


# ---------------------------------------------------------------------------
# Simulations — six entries, filled column-major into the 3x2 grid.
# This script reads a FLAT list (sim_type alongside name/snapshot), unlike the
# nested sim_type/sims form used by the configs in configs/lensing/.
# ---------------------------------------------------------------------------
simulations:
  # --- left column ---
  - sim_type: 'IllustrisTNG'
    name: 'TNG300-1'
    snapshot: 67        # z ≈ 0.5

  - sim_type: 'IllustrisTNG'
    name: 'Illustris-1'
    snapshot: 103       # z ≈ 0.5

  - sim_type: 'SIMBA'
    name: 'm100n1024'
    snapshot: 125       # z ≈ 0.5
    feedback: 's50'

  # --- right column ---
  # feedback holds the FLAMINGO variant directory name ('L1_m9' = fiducial).
  #
  # n_pixels: 2000 overrides the global 1000. The L1_m9 box is 681,000 ckpc/h,
  # so 2000 voxels give 341 ckpc/h each (32 GB per float32 field) rather than
  # 681. That is still coarser than the 222 ckpc/h shell width, so the innermost
  # 3D bins stay poorly resolved and run_3d_stacking warns about it -- matching
  # TNG300-1's 205 ckpc/h would need n_pixels ~3300 (~147 GB per field). The 2D
  # panels are unaffected; they use 0.2 arcmin pixels.
  - sim_type: 'FLAMINGO'
    name: 'L1_m9'
    snapshot: 67        # z ≈ 0.5 (the only FLAMINGO snapshot downloaded)
    feedback: 'L1_m9'
    n_pixels: 2000

  - sim_type: 'FLAMINGO'
    name: 'L1_m9'
    snapshot: 67
    feedback: 'fgas-8sigma'
    n_pixels: 2000

  - sim_type: 'FLAMINGO'
    name: 'L1_m9'
    snapshot: 67
    feedback: 'Jet_fgas-4sigma'
    n_pixels: 2000
