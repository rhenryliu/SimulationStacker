# Config for simulated_dsigma_ratio_masked.py at z ~ 0.26 (2026-10-12): the
# beam-compensated DeltaSigma ratio masking figure (dsigma_ratio_z05_masked_nobeam.yaml)
# for the DESI BGS, in the layout of the paper's z ~ 0.26 f_gas figure
# (ratios_z026_bgs.yaml): TNG300-1, Illustris-1 and SIMBA-100 (z = 0.26) on the
# top row, the five FLAMINGO runs (snapshot 71, z = 0.30) on the bottom row.
# Meant to replace the CAP kSZ outside-fraction grid of the appendix.
#
# SHAM samples at the BGS lensing-fit densities (TNG300-1 at the 9.05e-2 edge
# of its fit, as in the appendix); masks around their hosts, built at particle
# level by runINT_masked_ionized_gas_particles_z026.sh. The FLAMINGO samples
# (7.3-8.6 million galaxies) are stacked through a fixed-seed random subsample of
# 4e5, as their lensing fits (user decision 2026-10-12).
# Run from the scripts/ directory:
#   python unbound_gas/simulated_dsigma_ratio_masked.py -p configs/unbound_gas/dsigma_ratio_z026_masked_nobeam.yaml --workers 8

stack:
  redshift: 0.26             # FLAMINGO entries override it with 0.3
  projection: 'yz'
  # Numerator: unconvolved ionized-gas fields, masked at particle level.
  numerator: 'ionized_gas_field'
  particle_type: 'ionized_gas'
  pixel_size: 0.2            # arcmin
  beam_size: 0               # arcmin FWHM; checked against the masked maps
  # Denominator: unconvolved total-matter field, unmasked in every column.
  particle_type_2: 'total'
  pixel_size_2: 0.2          # arcmin
  # The measurement's radii (9 points, 1' to 6') and the 0.75' DSigma annulus.
  min_radius: 1.0            # arcmin
  max_radius: 6.0            # arcmin
  num_radii: 9
  annulus: 0.75              # arcmin
  # Gas kept within these multiples of each host's R200m (columns 1-3).
  mask_radii: [1.0, 2.0, 3.0]
  # SHAM parent-mass cap (Msun/h), as the BGS lensing fits.
  halo_mass_upper: 5.0e+14
  # SHAM densities fitted to the HSC x DESI BGS lensing profile.
  abundance_from_fit: ['../data/fit_dsigma_ksz/fit_dsigma_ksz_z026_bgs.npz',
                       '../data/fit_dsigma_ksz/fit_dsigma_ksz_z030_bgs_L1_m9.npz',
                       '../data/fit_dsigma_ksz/fit_dsigma_ksz_z030_bgs_fgas-8sigma.npz',
                       '../data/fit_dsigma_ksz/fit_dsigma_ksz_z030_bgs_Jet_fgas-4sigma.npz',
                       '../data/fit_dsigma_ksz/fit_dsigma_ksz_z030_bgs_Mstar-1sigma.npz',
                       '../data/fit_dsigma_ksz/fit_dsigma_ksz_z030_bgs_Mstar-1sigma_fgas-4sigma.npz']
  # Seed of the FLAMINGO subsamples (max_objects below), as the lensing fits.
  subsample_seed: 0

plot:
  plot_data: true
  # Beam-compensated BGS measurement (beam_compensated_ratio_v2.py with
  # beam_compensated_z026.yaml, use_sim_scatter false).
  data_path: '../data/beam_compensated/beam_compensated_ionized_gas_total_z0.26.npz'
  data_keys: {theta: 'theta_arcmin', value: 'R_compensated', error: 'sigma_compensated'}
  data_label: 'Liu et al. 2026 (BGS, beam-corrected)'
  fig_path: '../figures/'
  fig_name: 'dsigma_ratio_yz_masked_nobeam'
  fig_type: 'pdf'
  plot_error_bars: true
  suptitle: false
  row_height: 3.8
  # The rows are at different redshifts, so each gets its own comoving axis.
  top_axis: 'every_row'
  legend_column: 0
  legend_loc: 'upper right'
  # Six entries in the FLAMINGO row: 10 pt keeps them above the 1 R200m curves.
  legend_fontsize: 10

simulations:
  - sim_type: 'IllustrisTNG'
    row: 0
    row_label: 'IllustrisTNG + SIMBA'
    sims:
      - name: 'TNG300-1'
        snapshot: 80
      - name: 'Illustris-1'
        snapshot: 116
  - sim_type: 'SIMBA'
    row: 0
    sims:
      - name: 'm100n1024'
        snapshot: 136
        feedback: 's50'
  - sim_type: 'FLAMINGO'
    row: 1
    row_label: 'FLAMINGO'
    sims:
      # feedback holds the FLAMINGO variant directory name ('L1_m9' = fiducial).
      - name: 'L1_m9'
        snapshot: 71
        feedback: 'L1_m9'
        redshift: 0.3
        max_objects: 400000
      - name: 'L1_m9'
        snapshot: 71
        feedback: 'fgas-8sigma'
        redshift: 0.3
        max_objects: 400000
      - name: 'L1_m9'
        snapshot: 71
        feedback: 'Jet_fgas-4sigma'
        redshift: 0.3
        max_objects: 400000
      - name: 'L1_m9'
        snapshot: 71
        feedback: 'Mstar-1sigma'
        redshift: 0.3
        max_objects: 400000
      - name: 'L1_m9'
        snapshot: 71
        feedback: 'Mstar-1sigma_fgas-4sigma'
        redshift: 0.3
        max_objects: 400000
