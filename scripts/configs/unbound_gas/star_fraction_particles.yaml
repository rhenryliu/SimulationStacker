  sims:
  - name: TNG100-1
    snapshot: 67
  - name: TNG300-1
    snapshot: 67
  - name: TNG300-2
    snapshot: 67
  - name: Illustris-1
    snapshot: 103
  - name: Illustris-2
    snapshot: 103
- sim_type: FLAMINGO
  sims:
  - name: L1_m9
    snapshot: 67
    feedback: L1_m9
    n_pixels: 2000
