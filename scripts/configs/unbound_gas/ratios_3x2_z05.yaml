# ratios_3x2_z05.yaml
# ====================
# Configuration for make_ratios3x2.py
#
# Produces a grid of particle-type fraction profiles normalised by the
# cosmic baryon fraction (OmegaBaryon / OmegaMatter).
#
#   Rows (one per suite, config order): IllustrisTNG, SIMBA, FLAMINGO
#
#   Columns (stack.columns): '3d'   = 3D spherical profiles (comoving kpc/h)
#                            'col1' = 2D projected, cumulative (arcmin)
#                            'col2' = 2D projected, CAP filter (arcmin)
#                            'col3' = 2D projected, DSigma filter (arcmin)
#   The paper figure shows all four columns.

stack:
  # Redshift of the simulation snapshot targeted
  redshift: 0.5

  # Projection axis for the 2D maps and 3D field construction
  projection: 'yz'         # options: 'xy', 'xz', 'yz'

  # I/O caching: load pre-computed fields/stacks when available
  load_field: true
  save_field: true

  # Whether to subtract the field mean before stacking
  subtract_mean: false

  # Particle types: fraction plotted is particle_type / particle_type_2
  # Change these to produce different fraction figures, e.g. 'tau' / 'total',
  # 'star' / 'total', 'baryon' / 'total', etc.
  # particle_type:   'ionized_gas'
  particle_type:   'baryon'
  particle_type_2: 'total'

  # ------------------------------------------------------------------
  # Column 0 — 3D spherical profile parameters
  # ------------------------------------------------------------------
  n_pixels:      1000     # pixels per side for the 3D density field
  min_radius_3d: 200.0    # innermost radial bin (comoving kpc/h)
  max_radius_3d: 4000.0   # outermost radial bin (comoving kpc/h)
  num_radii_3d:  11       # number of radial bins

  # Halo mass selection (applied to all three columns)
  halo_mass_min: 1.665e13   # lower bound in Msun  (~10^13.22)
  halo_mass_max: 5.0e14     # upper bound in Msun  (null to disable)

  # ------------------------------------------------------------------
  # Columns 1 & 2 — 2D projected profile parameters
  # ------------------------------------------------------------------
  # The 2D columns reuse the 3D comoving radial range (min_radius_3d,
  # max_radius_3d, num_radii_3d) above, converted to arcmin per-simulation, so
  # they extend to the same comoving extent (4000 ckpc/h) as the 3D column.
  pixel_size:    0.5      # map pixel size (arcmin)
  rad_distance:  1.0      # multiplicative scaling applied to arcmin radii in plots
  # Depreciated yaml params:
  min_radius_2d: 1.0      # innermost radial bin (arcmin, before rad_distance scaling)
  max_radius_2d: 10.0     # outermost radial bin (arcmin, before rad_distance scaling)
  num_radii_2d:  11       # number of radial bins

  # Column 1: filter applied to numerator and denominator when stacking in 2D
  filter_type_col1:   'cumulative'   # options: 'CAP', 'cumulative', 'DSigma', 'upsilon'
  filter_type_2_col1: 'cumulative'

  # Column 2: CAP aperture filter
  filter_type_col2:   'CAP'
  filter_type_2_col2: 'CAP'

  # Column 3: DSigma filter (0.75 arcmin annulus, the stackMap default), on
  # the same beam-convolved maps as columns 1 and 2
  filter_type_col3:   'DSigma'
  filter_type_2_col3: 'DSigma'

  # Columns drawn, left to right (default ['3d', 'col1', 'col2']).
  columns: ['3d', 'col1', 'col2', 'col3']


plot:
  fig_path: '../figures/'
  fig_name: 'ratios_3x2_yz'    # output file will be named <fig_name>_<particle_type>.pdf
  # Narrower panels so four columns keep the figure about as wide as three did.
  panel_width: 4.6
  panel_height: 4.0
  fig_type: 'pdf'
  plot_error_bars: true


simulations:
  # ----------------------------------------------------------------
  # TNG suite — placed in the top row of the figure
  # ----------------------------------------------------------------
  - sim_type: 'IllustrisTNG'
    sims:
      # - name: 'TNG50-1'
        # snapshot: 67
      - name: 'TNG100-1'
        snapshot: 67
      - name: 'TNG300-1'
        snapshot: 67
      # - name: 'TNG300-2'
      #   snapshot: 67
      - name: 'Illustris-1'
        snapshot: 103
      # - name: 'Illustris-2'
      #   snapshot: 103

  # ----------------------------------------------------------------
  # SIMBA suite — placed in the bottom row of the figure
  # ----------------------------------------------------------------
  - sim_type: 'SIMBA'
    sims:
      # - name: 'm50n512'
      #   snapshot: 125
      #   feedback: 's50'
      - name: 'm50n512'
        snapshot: 125
        feedback: 's50noagn'
      - name: 'm50n512'
        snapshot: 125
        feedback: 's50nox'
      # - name: 'm50n512'
      #   snapshot: 125
      #   feedback: 's50nojet'
      - name: 'm50n512'
        snapshot: 125
        feedback: 's50nofb'
      - name: 'm100n1024'
        snapshot: 125
        feedback: 's50'

  # ----------------------------------------------------------------
  # FLAMINGO suite — third row. feedback holds the variant directory name
  # ('L1_m9' = fiducial). n_pixels: 2000 gives 341 ckpc/h voxels in the 3D
  # column (1000 would give 681 ckpc/h, coarser than R200m); still coarser
  # than TNG300-1's 205 ckpc/h at 1000.
  # ----------------------------------------------------------------
  - sim_type: 'FLAMINGO'
    sims:
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'L1_m9'
        n_pixels: 2000
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'fgas-8sigma'
        n_pixels: 2000
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'Jet_fgas-4sigma'
        n_pixels: 2000
