# pk_fstar_z05_mstar.yaml: the f* floor (compute_fstar.py) for the FLAMINGO
# stellar-mass variants, reduced to the one configuration the P(k)-section
# figure uses (aperture 1 x R200m, M_FoF >= 1e13), whose region sums
# compute_fstar_obs.py reads. Iteration 3, 2026-09-29; the other runs'
# floors come from pk_fstar_z05.yaml (header below kept from that file).
#
# pk_fstar_z05.yaml
# -----------------
# Stellar-fraction bands (unbound gas paper, P(k) section) at z ~ 0.5: the
# S(k) and lensing f_gas(theta) figures with the simulation (solid), all
# selected stars converted to ionized gas (f* = 0, dashed; the s = 0 transfer
# of pk_components_z05.yaml's `stellar:` block, whose files are reused) and a
# stellar-fraction floor (dotted): every selected halo region whose star
# fraction f* = M*/(M* + M_wind + M_gas + M_BH) is below the method's target
# gains stars laid out like its stars, taken from its ionized gas.
#
# Read by (run from the scripts/ directory):
#   unbound_gas/compute_fstar.py     -- floor fields, spectra and 2D maps
#   unbound_gas/stack_fstar_maps.py  -- lensing stacks of the floor maps
#   unbound_gas/make_pk_fstar.py     -- figures and table
#   (runINT_fstar.sh runs the first two, one simulation per node)
# pk_components_z05.yaml is unchanged and still reproduces the s figures.

pk:
  threads: 128
  k_table: [0.5, 1.0, 2.0, 5.0, 10.0]

# The configurations (methods, apertures, mass cuts) of the s = 0 transfer;
# the f* = 0 end reads its _Pk_stellar_ spectra and lensing stacks.
stellar:
  methods: ['aperture']
  aperture_radii: [1.0]                      # x, in units of R200m
  halo_mass_min: [1.0e13]                    # FoF GroupMass cut [Msun/h]
  stellar_scales: [1.0, 0.0]

# Stellar-fraction floor per method variant (fof = membership, ap1 = 1 R200m,
# ap2 = 2 R200m apertures): each region's f* is raised to at least the target
# (user decisions 2026-09-24). Winds count as gas, BH are included.
fstar:
  targets:
    ap1: 0.4

# Same lensing observable, sample and data as pk_components_z05.yaml.
lensing:
  config: configs/lensing/mass_ratio_noBeam_z05_mstar.yaml
  data: ../data/beam_compensated/beam_compensated_ionized_gas_total_z0.5.npz
  sample_name: 'lens'
  overrides: {}

plot:
  fig_path: '../figures/'
  fig_name: 'pk_fstar_z05_mstar'
  fig_type: 'pdf'
  z_label: '$z \simeq 0.5$'
  exclude_sims: ['m100n1024']   # SIMBA computed but left out of the figures (for now)

# ---------------------------------------------------------------------------
# Simulations: copied from pk_components_z05.yaml (same snapshots, grids, DMO).
# ---------------------------------------------------------------------------
simulations:
  - sim_type: 'FLAMINGO'
    name: 'L1_m9'
    snapshot: 67
    feedback: 'Mstar-1sigma'
    n_pixels: 2000
    dmo: &flamingo_dmo
      name: 'L1_m9'
      feedback: 'L1_m9_DMO'
      snapshot: 67
      path: 'FLAMINGO/L1_m9/L1_m9_DMO/snapshots/flamingo_0067/FLAMINGO/L1_m9/L1_m9_DMO/snapshots/flamingo_0067/'
  - sim_type: 'FLAMINGO'
    name: 'L1_m9'
    snapshot: 67
    feedback: 'Mstar-1sigma_fgas-4sigma'
    n_pixels: 2000
    dmo: *flamingo_dmo
