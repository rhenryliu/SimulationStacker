# Config for simulated_dsigma_ratio_masked.py: the beam-compensated DeltaSigma
# ratio masking figure (dsigma_ratio_z05_masked_nobeam.yaml) on the SHAM samples
# of Liu et al. 2026's LRG comparison, at the fixed density n = 5e-4 (cMpc/h)^-3
# instead of the lensing-fit densities (unbound gas paper, 2026-10-12). The
# unmasked column is then the companion's own simulated f_gas (same samples,
# fields, annulus and radii).
#
# The masked ionized-gas fields are built at particle level around the hosts
# of these galaxies by precompute_masked_particles.py --density 5e-4
# (runINT_masked_ionized_gas_particles_n5e-4.sh). No beam-factor report: the
# published compensation was computed on these same samples.
# Run from the scripts/ directory:
#   python unbound_gas/simulated_dsigma_ratio_masked.py -p configs/unbound_gas/dsigma_ratio_z05_masked_nobeam_n5e-4.yaml --workers 12

stack:
  redshift: 0.5
  projection: 'yz'
  # Numerator: unconvolved ionized-gas fields, masked at particle level.
  numerator: 'ionized_gas_field'
  particle_type: 'ionized_gas'
  pixel_size: 0.2            # arcmin
  beam_size: 0               # arcmin FWHM; checked against the masked maps
  # Denominator: unconvolved total-matter field, unmasked in every column.
  particle_type_2: 'total'
  pixel_size_2: 0.2          # arcmin
  # The measurement's radii (9 points, 1' to 6') and the 0.75' DSigma annulus.
  min_radius: 1.0            # arcmin
  max_radius: 6.0            # arcmin
  num_radii: 9
  annulus: 0.75              # arcmin
  # Gas kept within these multiples of each host's R200m (columns 1-3).
  mask_radii: [1.0, 2.0, 3.0]
  # SHAM parent-mass cap (Msun/h), as the companion and the masked maps.
  halo_mass_upper: 5.0e+14
  # Fixed SHAM density (cMpc/h)^-3 for every simulation, as Liu et al. 2026
  # for the DESI LRGs (approximately their number density).
  halo_abundance_target: 5.0e-4

plot:
  plot_data: true
  # Beam-compensated measurement (beam_compensated_ratio_v2.py, use_sim_scatter false).
  data_path: '../data/beam_compensated/beam_compensated_ionized_gas_total_z0.5.npz'
  data_keys: {theta: 'theta_arcmin', value: 'R_compensated', error: 'sigma_compensated'}
  data_label: 'Liu et al. 2026 (beam-corrected)'
  fig_path: '../figures/'
  fig_name: 'dsigma_ratio_yz_masked_nobeam_n5e-4'
  fig_type: 'pdf'
  plot_error_bars: true
  suptitle: false
  row_height: 3.8
  # Legends in the 1 R200m column, as in the beamed figure.
  legend_column: 0
  legend_loc: 'upper right'
  # Room above the curves for the legends (the SIMBA-50 rows reach ~0.65 at 1').
  ylim: [0.05, 1.2]

simulations:
  - sim_type: 'SIMBA'
    sims:
      - name: 'm50n512'
        snapshot: 125
        feedback: 's50noagn'
      - name: 'm50n512'
        snapshot: 125
        feedback: 's50nox'
      - name: 'm50n512'
        snapshot: 125
        feedback: 's50nofb'
      - name: 'm100n1024'
        snapshot: 125
        feedback: 's50'
  - sim_type: 'IllustrisTNG'
    sims:
      - name: 'TNG100-1'
        snapshot: 67
      - name: 'TNG300-1'
        snapshot: 67
      - name: 'Illustris-1'
        snapshot: 103
  - sim_type: 'FLAMINGO'
    row_label: 'FLAMINGO'
    sims:
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'L1_m9'
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'fgas-8sigma'
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'Jet_fgas-4sigma'
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'Mstar-1sigma'
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'Mstar-1sigma_fgas-4sigma'
