    snapshot: 125
    feedback: s50noagn
  - name: m50n512
    snapshot: 125
    feedback: s50nox
  - name: m50n512
    snapshot: 125
    feedback: s50nojet
  - name: m50n512
    snapshot: 125
    feedback: s50nofb
  - name: m100n1024
    snapshot: 125
    feedback: s50
