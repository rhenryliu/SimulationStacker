# star_fraction_particles.yaml: Figure 1 from the merged particle-based fractions
# (star_fraction_particles_{1,2,3}.yaml of job 59070120, merged into load_path; same
# convention as star_fraction_v2.yaml, whose load_path is also in the figures folder).
