# Config for lensing/compare_cmb_fgas.py (not a paper figure).
# Overlays the beam-compensated DESI x ACT x HSC f_gas(R) points (same as the
# data points in beam_compensated_z05.yaml) with the DESI LS x ACT DR6 f_gas
# points digitized from Hadzhiyska et al. (2025), arXiv:2507.14136 Fig. 6 (top).
# The beamTest simulations are only stacked (if the cached beam factor is
# missing or stale) to recompute the beam compensation factor.
# With use_sims: true the simulation f_gas curves are also plotted, stacked
# exactly as in beam_compensated_ratio_v2.py Phase 3 using the stack and
# simulations sections below (copied from mass_ratio_noBeam_z05.yaml).
beam_test_config: mass_ratio_beamTest_z05.yaml

use_sims: true  # if true, stack and plot the simulations below

compensation:
  use_sim_scatter: false  # if true, scatter of beam_factor across sims is propagated into data error
  load_beam_factor: true  # read beam_test_config's beam_factor.npz_path; restack if missing or stale

plot:
  data_path: /pscratch/sd/r/rhliu/projects/Weak_lensing/ratio_measurements/spec_Y3/ratio_LRG_full_no_src_with_cluster_mask_zbin1_DSigma_ksz_ggl.npz
  data_label: 'LRG z-bin 1 (z$\sim$0.51) (beam-corrected)'
  cmb_fgas_path: ../data/cmb_fgas/fgas_desi_ls_x_act_dr6_fig6_extended_lrgs.npz
  cmb_fgas_label: 'Hadzhiyska et al. (2025) (extended LRGs)'
  x_offset: 0.025  # arcmin; the two datasets are shifted by -/+ this so markers do not overlap
  fig_path: '../figures/'
  fig_name: 'compare_cmb_fgas'
  fig_type: 'png'
  ylabel: '$f_{\rm gas}(R)$'
  plot_error_bars: true  # use_sims only: shaded error band on the simulation curves
  plot_r200m: true       # use_sims only: vertical line at the first IllustrisTNG sim's mean R200m

# Stacking settings for the simulation curves (used only when use_sims is true).
stack:
  redshift: 0.5
  load_field: true
  save_field: true

  stack_field: false # If false, stacks maps instead of fields
  rad_distance: 1.0 # in arcmin, or comoving kpc/h if stack_field is true
  min_radius: 1.0 # in rad_distance units
  max_radius: 6.0 # in rad_distance units
  num_radii: 9 # Number of radial bins between min_radius and max_radius

  mask_haloes: false
  mask_radii: 3.0 # Number of virial radii to mask out for haloes. In units of R200c

  n_pixels: 1000 # Number of pixels on a side if stack_field is true
  projection: 'yz' # 'xy', 'xz', 'yz'

  filter_type: 'DSigma' # Options: 'CAP', 'cumulative', 'DSigma', 'upsilon'
  particle_type: 'ionized_gas' # 'DM', 'gas', 'stars', 'total', 'ionized_gas'
  pixel_size: 0.2 # in arcmin
  beam_size: null # in arcmin

  filter_type_2: 'DSigma' # Options: 'CAP', 'cumulative', 'DSigma', 'upsilon'
  particle_type_2: 'total'
  pixel_size_2: 0.2 # in arcmin
  beam_size_2: null # in arcmin

  subtract_mean: false # Whether to subtract the mean of the field before stacking
  use_subhalos: true # Whether to use subhalos instead of host halos for stacking. If true, will select subhalos based on abundance matching to match the number density specified by the user (see below).
  halo_abundance_target: 5.0e-4 # Target halo abundance for subhalo selection when use_subhalos is true. In units of h^3/Mpc^3.


# Simulations for the f_gas curves (used only when use_sims is true).
simulations:
  - sim_type: 'SIMBA'
    sims:
      # - name: 'm50n512'
      #   snapshot: 125
      #   feedback: 's50'
      # - name: 'm50n512'
      #   snapshot: 125
      #   feedback: 's50noagn'
      # - name: 'm50n512'
      #   snapshot: 125
      #   feedback: 's50nox'
      # - name: 'm50n512'
      #   snapshot: 125
      #   feedback: 's50nojet'
      # - name: 'm50n512'
      #   snapshot: 125
      #   feedback: 's50nofb'
      - name: 'm100n1024'
        snapshot: 125
        feedback: 's50'
  - sim_type: 'IllustrisTNG'
    sims:
      # - name: 'TNG100-1'
      #   snapshot: 67
      - name: 'TNG300-1'
        snapshot: 67
      # - name: 'TNG300-2'
      #   snapshot: 67
      # - name: 'TNG50-3'
      #   snapshot: 67
      - name: 'Illustris-1'
        snapshot: 103
      # - name: 'Illustris-2'
      #   snapshot: 103
  - sim_type: 'FLAMINGO'
    sims:
      # feedback holds the FLAMINGO variant directory name ('L1_m9' = fiducial)
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'L1_m9'
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'fgas-8sigma'
      - name: 'L1_m9'
        snapshot: 67
        feedback: 'Jet_fgas-4sigma'
